<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>しーちゃん占い</title>
<meta name="theme-color" content="#5b2a86">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しーちゃん占い">
<style>
:root{--gold:#ffd23f;--red:#e63946;--navy:#23164a;--ink:#2b1d0e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:var(--ink);
 background:linear-gradient(170deg,#3a1460 0%,#7b2a86 35%,#e8577a 70%,#ffb347 100%) fixed;overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;animation:tw 2.4s infinite alternate}
@keyframes tw{from{opacity:.15;transform:scale(.6)}to{opacity:1;transform:scale(1.3)}}
.petal{position:absolute;top:-40px;font-size:22px;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.screen{position:relative;z-index:1;display:none;min-height:100%;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 20px)}
.screen.on{display:block}
button{font-family:inherit;border:none;cursor:pointer;transition:transform .08s,filter .08s,box-shadow .08s}
button:active,.press:active{transform:translateY(3px) scale(.95);filter:brightness(.82)}
/* ---------- home ---------- */
.hero{display:flex;align-items:flex-end;gap:8px;margin-top:4px}
.hero img{width:118px;flex:none;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.bubble{position:relative;background:#fff;border-radius:18px;padding:10px 12px;font-size:15px;line-height:1.5;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18);flex:1;margin-bottom:22px}
.bubble:after{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;border-left:0}
h1{margin:6px 0 0;text-align:center;font-size:30px;color:#fff;letter-spacing:2px;text-shadow:0 3px 0 #b8336a,0 0 14px rgba(255,210,63,.9)}
h1 small{display:block;font-size:13px;letter-spacing:1px;color:var(--gold);text-shadow:none}
.banner{margin:14px 0 10px;background:#4a4a4f;border-radius:14px;padding:8px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.banner img{width:100%;max-width:520px;border-radius:8px;display:block;margin:0 auto}
.banner .addr{color:#fff;font-size:12px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:linear-gradient(180deg,#fff 0%,#fff6d8 100%);border-radius:20px;padding:8px 6px 10px;box-shadow:0 5px 0 #c9852c,0 0 0 3px var(--gold) inset;text-align:center;position:relative}
.card img{width:100%;height:120px;object-fit:contain;pointer-events:none}
.card b{display:block;font-size:16px;margin-top:4px}
.card span{display:block;font-size:11px;color:#7a5a2a;margin-top:2px;min-height:15px}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{background:var(--gold);color:var(--ink);font-weight:800;font-size:16px;border-radius:16px;padding:14px 10px;box-shadow:0 5px 0 #b8860b;width:100%}
.btn.pink{background:#ff7aa8;color:#fff;box-shadow:0 5px 0 #b8336a}
.btn.blue{background:#3a86ff;color:#fff;box-shadow:0 5px 0 #1d4fb0}
.btn.white{background:#fff;box-shadow:0 5px 0 #aaa}
.ver{text-align:center;color:#fff;font-size:12px;margin-top:14px;opacity:.9}
/* ---------- play ---------- */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.back{background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:15px;box-shadow:0 4px 0 #999;flex:none}
.top h2{margin:0;color:#fff;font-size:20px;text-shadow:0 2px 0 #b8336a;flex:1;text-align:center;padding-right:60px}
.say{position:relative;display:flex;align-items:flex-start;gap:6px;margin:4px 0 8px}
.say img{width:92px;flex:none}
.say .bubble{margin:8px 0 0;font-size:16px}
.stage{position:relative;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55);border-radius:24px;height:min(62vh,500px);touch-action:none;overflow:hidden}
.hint{position:absolute;z-index:20;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 3px rgba(0,0,0,.5);pointer-events:none}
.meter{position:absolute;left:14px;right:14px;top:12px;height:14px;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden;pointer-events:none}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7aa8,#ffd23f);border-radius:9px;transition:width .1s}
/* omikuji */
.tube{position:absolute;left:50%;top:50%;width:110px;height:230px;margin:-100px 0 0 -55px;border-radius:14px;background:repeating-linear-gradient(90deg,#c58a4b 0 18px,#b0763a 18px 22px);box-shadow:inset 0 0 0 4px #7a4a1c,0 8px 0 rgba(0,0,0,.25)}
.tube:before{content:"";position:absolute;left:30px;top:-8px;width:50px;height:16px;border-radius:50%;background:#3b2210}
.tube .lab{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#fff;border:2px solid var(--red);color:var(--red);font-weight:900;writing-mode:vertical-rl;padding:8px 4px;font-size:20px;border-radius:4px}
.stick{position:absolute;width:16px;border-radius:4px;background:linear-gradient(90deg,#e9c88a,#d4a95c);box-shadow:inset 0 0 0 2px #9b7434}
.stick em{position:absolute;left:0;right:0;top:6px;font-style:normal;font-size:11px;font-weight:900;color:var(--red);writing-mode:vertical-rl;text-align:center;line-height:16px}
/* amida */
.amida{position:absolute;inset:0}
.stage .lbl,.stage .st{position:absolute;width:30px;margin-left:-15px;text-align:center;font-weight:900;border-radius:8px}
.stage .lbl{top:8px;padding:4px 0;font-size:13px;background:#fff;writing-mode:vertical-rl;text-orientation:upright;height:56px;line-height:30px;overflow:hidden}
.stage .st{bottom:8px;height:40px;line-height:40px;background:var(--gold);box-shadow:0 4px 0 #b8860b;font-size:16px}
.cheer{position:absolute;right:4px;width:96px;bottom:56px;pointer-events:none;display:none}
.flagtxt{position:absolute;font-weight:900;color:var(--red);transform:rotate(-6deg);pointer-events:none;white-space:nowrap}
/* fukubiki / gacha */
.legend{position:absolute;left:10px;top:34px;background:#fff;border-radius:12px;padding:6px 8px;font-size:12px;font-weight:700;line-height:1.55;pointer-events:none}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1px solid #0003}
.ball{position:absolute;width:44px;height:44px;border-radius:50%;box-shadow:inset -6px -6px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.5),0 4px 6px rgba(0,0,0,.3)}
/* petals */
.flypetal{position:absolute;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 3px #000;pointer-events:none;transition:transform 1s ease-out,opacity 1s}
/* ---------- result ---------- */
#result{background:rgba(25,10,40,.55)}
.rcard{position:relative;background:linear-gradient(180deg,#fffdf4,#ffeec2);border-radius:26px;padding:16px 16px 18px;box-shadow:0 0 0 4px var(--gold) inset,0 8px 0 rgba(0,0,0,.25);margin-top:6px}
.badge{position:absolute;right:12px;top:12px;background:#5b2a86;color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px}
.rimg{display:block;width:62%;max-width:260px;margin:22px auto 0;animation:pop .6s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.rlevel{text-align:center;font-size:58px;font-weight:900;margin:6px 0 2px;letter-spacing:4px;animation:pop .7s .15s cubic-bezier(.3,1.6,.6,1) both}
.rkind{text-align:center;font-size:13px;color:#7a5a2a;font-weight:700}
.rtext{font-size:17px;line-height:1.75;margin:12px 0;font-weight:600}
.lucky{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.lucky div{background:#fff;border-radius:14px;padding:8px;text-align:center;font-size:14px;font-weight:700;box-shadow:0 3px 0 #e2c27a}
.lucky small{display:block;font-size:11px;color:#a07a3a}
.rbtns{display:grid;gap:10px;margin-top:14px}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:22px;padding:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;text-align:center}
.mbox img{max-width:100%;border-radius:12px}
.mbox p{font-size:16px;line-height:1.6;font-weight:700}
#notice .mbox{border:4px solid var(--red)}
#notice p{color:var(--red);font-size:19px}
.hist{list-style:none;padding:0;margin:8px 0;text-align:left;font-size:15px}
.hist li{padding:8px 4px;border-bottom:1px dashed #ddd;display:flex;gap:8px}
.hist li b{min-width:64px}
</style>
</head>
<body>
<div id="sky"></div>

<!-- HOME -->
<section id="home" class="screen on">
 <h1 data-t="title">しーちゃん占い<small data-t="sub">8つの占いで遊ぼう！</small></h1>
 <div class="hero">
  <img src="img/guide.webp" alt="">
  <div class="bubble" data-t="welcome">はいさい！占いをえらんでね。何回でもできるよ〜</div>
 </div>
 <div class="banner" id="banner">
  <img src="img/logo.webp" alt="MIRATERIA">
  <div class="addr" data-t="addr">沖縄県島尻郡八重瀬町長毛379-3</div>
 </div>
 <div class="grid" id="grid"></div>
 <div class="foot">
  <button class="btn white" id="bHist" data-t="hist">これまでの結果</button>
  <button class="btn blue" id="bHow" data-t="how">ホーム画面に追加する方法</button>
  <button class="btn pink" id="bInsta" data-t="insta">インスタを見る</button>
  <button class="btn white" id="bShot" data-t="shot">画面全体を画像で保存</button>
 </div>
 <div class="ver" id="ver"></div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
 <div class="top"><button class="back" id="bBack" data-t="back">← もどる</button><h2 id="pTitle"></h2></div>
 <div class="say"><img id="pImg" alt=""><div class="bubble" id="pSay"></div></div>
 <div class="stage" id="stage"></div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
 <div class="rcard" id="rcard">
  <div class="badge" data-t="badge">アプリ占い</div>
  <img class="rimg" id="rImg" alt="">
  <div class="rlevel" id="rLevel"></div>
  <div class="rkind" id="rKind"></div>
  <div class="rtext" id="rText"></div>
  <div class="lucky">
   <div><small data-t="litem">ラッキーアイテム</small><span id="rItem"></span></div>
   <div><small data-t="lcolor">ラッキーカラー</small><span id="rColor"></span></div>
  </div>
 </div>
 <div class="rbtns">
  <button class="btn" id="bAgain" data-t="again">もう一回占う</button>
  <button class="btn pink" id="bSave" data-t="save">結果を画像で保存</button>
  <button class="btn white" id="bHome" data-t="home">占いえらびにもどる</button>
 </div>
</section>

<div class="modal" id="mHow"><div class="mbox"><img src="img/howto.webp" alt=""><p data-t="android">Androidの人は「Chrome」で開いてね</p><button class="btn" data-close data-t="close">とじる</button></div></div>
<div class="modal" id="mHist"><div class="mbox"><p data-t="hist">これまでの結果</p><ul class="hist" id="histList"></ul><button class="btn" data-close data-t="close">とじる</button></div></div>
<div class="modal" id="mImg"><div class="mbox"><p data-t="longpress">画像を長押しして保存してね</p><img id="mImgEl" alt=""><br><br><button class="btn" data-close data-t="close">とじる</button></div></div>
<div class="modal" id="notice"><div class="mbox"><p data-t="privacy">このアプリは個人情報を集めたり、外に送ったりしません。占いはスマホの中だけで動きます。</p><small data-t="tapclose">（タップで閉じます）</small></div></div>
<div class="modal" id="m100"><div class="mbox"><img src="img/guide.webp" style="width:45%" alt=""><p data-t="thanks">いつも使ってくれてありがとう！感想をインスタで教えてくれたらうれしいな。もっと楽しくしていくね！</p><button class="btn pink" id="b100insta" data-t="insta">インスタを見る</button><br><br><button class="btn white" data-close data-t="close">とじる</button></div></div>

<script>
"use strict";
const VERSION="1.0.0";
const INSTA="https://www.instagram.com/mirateria.project/";
const JA=(navigator.language||"ja").toLowerCase().startsWith("ja");
const L=(j,e)=>JA?j:e;
const $=id=>document.getElementById(id);

/* ===== UI text ===== */
const T={title:["しーちゃん占い","Shi-chan Fortune"],sub:["8つの占いで遊ぼう！","8 fun ways to read your luck!"],
welcome:["はいさい！占いをえらんでね。何回でもできるよ〜","Haisai! Pick a fortune. Play as many times as you like!"],
addr:["沖縄県島尻郡八重瀬町長毛379-3","379-3 Nagake, Yaese, Shimajiri, Okinawa"],
hist:["これまでの結果","My results"],how:["ホーム画面に追加する方法","Add to Home Screen"],insta:["インスタを見る","Instagram"],
shot:["画面全体を画像で保存","Save whole screen"],back:["← もどる","← Back"],badge:["アプリ占い","App fortune"],
litem:["ラッキーアイテム","Lucky item"],lcolor:["ラッキーカラー","Lucky color"],again:["もう一回占う","Play again"],
save:["結果を画像で保存","Save result image"],home:["占いえらびにもどる","Choose another"],
android:["Androidの人は「Chrome」で開いてね","Android users: please open in Chrome"],close:["とじる","Close"],
longpress:["画像を長押しして保存してね","Press and hold the image to save"],
privacy:["このアプリは個人情報を集めたり、外に送ったりしません。占いはスマホの中だけで動きます。","This app does not collect or send any personal information. Fortunes run only on your phone."],
tapclose:["（タップで閉じます）","(Tap to close)"],
thanks:["いつも使ってくれてありがとう！感想をインスタで教えてくれたらうれしいな。もっと楽しくしていくね！","Thanks for always playing! Tell us what you think on Instagram. We'll keep making it more fun!"]};
document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(!T[k])return;
 if(el.firstChild&&el.firstChild.nodeType===3&&el.children.length){el.firstChild.nodeValue=T[k][JA?0:1]}else el.textContent=T[k][JA?0:1]});
document.title=T.title[JA?0:1];document.documentElement.lang=JA?"ja":"en";
$("ver").textContent="Version "+VERSION+" ／ MIRATERIA";

/* ===== sound (no voice) ===== */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type="square",vol=.12,slide=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),a.currentTime+d);g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
const SND={pi:()=>tone(1320,.07),rattle:()=>{for(let i=0;i<4;i++)setTimeout(()=>tone(300+Math.random()*500,.04,"triangle",.1),i*25)},
 pop:()=>tone(500,.18,"sine",.2,700),bell:()=>{[1568,2093,1568,2093].forEach((f,i)=>setTimeout(()=>tone(f,.25,"sine",.15),i*120))},
 click:()=>tone(180,.05,"square",.12),crack:()=>{for(let i=0;i<5;i++)setTimeout(()=>tone(150+Math.random()*900,.03,"sawtooth",.1),i*18)},
 fan:()=>{[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.3,"triangle",.14),i*90))},
 kyo:()=>{[392,330,262,523,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,"triangle",.14),i*110))},
 heart:()=>tone(880+Math.random()*300,.06,"sine",.08)};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
document.addEventListener("click",e=>{if(e.target.closest("button,.card,.st,[data-tap]"))SND.pi()},true);

/* ===== background decoration ===== */
(function(){const s=$("sky");for(let i=0;i<40;i++){const d=document.createElement("i");d.className="star";d.style.left=Math.random()*100+"%";d.style.top=Math.random()*70+"%";d.style.animationDelay=Math.random()*2.4+"s";s.appendChild(d)}
 const pe=["🌺","✨","🌸","⭐"];for(let i=0;i<9;i++){const p=document.createElement("i");p.className="petal";p.textContent=pe[i%4];p.style.left=Math.random()*100+"%";p.style.animationDuration=9+Math.random()*9+"s";p.style.animationDelay=-Math.random()*15+"s";s.appendChild(p)}})();

/* ===== fortune data ===== */
const LV=[
 {k:"daikichi",j:"大吉",e:"Great Luck",w:14,c:"#e63946",ball:"#f5c518"},
 {k:"chukichi",j:"中吉",e:"Good Luck",w:18,c:"#e8577a",ball:"#e63946"},
 {k:"shokichi",j:"小吉",e:"Small Luck",w:20,c:"#3a86ff",ball:"#3a86ff"},
 {k:"kichi",j:"吉",e:"Luck",w:24,c:"#2a9d4b",ball:"#2a9d4b"},
 {k:"suekichi",j:"末吉",e:"Future Luck",w:20,c:"#b8860b",ball:"#ffffff"},
 {k:"kyo",j:"凶",e:"Rare Kyo",w:4,c:"#6a2c91",ball:"#7b2fbe"}];
const lvName=l=>JA?l.j:l.e;
function draw(){let r=Math.random()*100,s=0;for(const l of LV){s+=l.w;if(r<s)return l}return LV[3]}
const OPEN={
daikichi:[["最高の運気がめぐってきています。やりたかったことに手を伸ばすなら今です。","Your luck is at its peak. If there's something you've wanted to try, now is the time."],["空がぱっと晴れたような一日。あなたの笑顔がまわりの人まで明るくします。","Like the sky suddenly clearing. Your smile will brighten everyone around you."],["追い風がビュンビュン吹いています。少し大胆なくらいがちょうどいい日です。","A strong tailwind is behind you. Being a little bold is just right today."],["うれしい知らせが届きそうな予感。連絡はこまめにチェックしてね。","Good news seems to be on its way. Keep an eye on your messages."],["がんばってきたことが実を結ぶとき。自分をたくさんほめてあげて。","Your hard work is about to pay off. Give yourself plenty of praise."],["出会い運がぐんと上がっています。久しぶりの人に声をかけてみて。","Your luck with people is rising. Reach out to someone you haven't seen in a while."],["何をやってもうまく転がりそうな日。迷ったら「やる」を選んで大丈夫。","Everything seems to roll your way today. When in doubt, go for it."],["金色の光に包まれているような運勢です。小さな幸せがつぎつぎ見つかります。","You're wrapped in golden light. Little joys will keep popping up."]],
chukichi:[["運気はしっかり上向き。コツコツ続けてきたことに手ごたえを感じられそう。","Your luck is clearly rising. You'll feel results from your steady work."],["まわりの人の助けで、物事がスムーズに進みます。「ありがとう」を忘れずに。","Help from others makes things go smoothly. Don't forget to say thank you."],["ちょっとした思いつきが大当たりするかも。メモを手元に置いておこう。","A small idea could become a big hit. Keep a note handy."],["心がおだやかで、いい判断ができる日。大事なことは今日決めてもOK。","Your mind is calm and your judgment sharp. A fine day to decide important things."],["楽しい予定が増えそうな気配。誘われたら気軽に乗ってみて。","Fun plans seem to be coming. If invited, go along with it."],["体も心も元気いっぱい。少し遠くまで足をのばすといいことがあります。","Full of energy. Going a bit farther than usual brings good things."],["ほめられる場面がありそう。素直に受け取ると、運気がもっと上がります。","You may receive praise. Accept it openly and your luck will rise even more."],["探し物が見つかりやすい日。なくしたと思っていた物も出てくるかも。","A good day for finding things. Something you thought was lost may turn up."]],

/* 1 omikuji: hold & shake left-right, then swipe up */
omikuji(){
 say(L("筒を指で押さえたまま、左右に3〜4回ふってね！","Hold the tube and shake it left and right 3-4 times!"));
 const tube=el("div","tube");el("div","lab",tube,L("御神籤","FORTUNE"));
 for(let i=0;i<5;i++){const s=el("div","stick",tube);s.style.cssText+=`height:40px;left:${32+i*9}px;top:-${18+(i%2)*6}px;z-index:-1`}
 const m=meter();hint(L("👆 押さえて左右にふる","👆 Hold and shake"));
 let down=false,sx=0,sy=0,lastX=0,dir=0,ext=0,shakes=0,ready=false,done=false,need=7;
 stage.onpointerdown=e=>{if(done)return;down=true;const p=pos(e);sx=lastX=p.x;sy=p.y;ext=p.x;stage.setPointerCapture(e.pointerId)};
 stage.onpointermove=e=>{if(!down||done)return;const p=pos(e);const dx=p.x-sx;
  if(!ready){tube.style.transform=`translateX(${Math.max(-90,Math.min(90,dx))}px) rotate(${Math.max(-18,Math.min(18,dx/5))}deg)`;
   const d=Math.sign(p.x-lastX);if(d&&d!==dir){if(Math.abs(p.x-ext)>22){shakes++;SND.rattle();buzz(15);m(shakes/need)}dir=d;ext=p.x}lastX=p.x;
   if(shakes>=need){ready=true;tube.style.transform="";say(L("いいね！最後に上へシュッとスワイプ！","Nice! Now swipe up!"));hint(L("👆 上へシュッ！","👆 Swipe up!"));sy=p.y}}
  else if(sy-p.y>60){done=true;out()}};
 stage.onpointerup=stage.onpointercancel=e=>{down=false;if(!ready)tube.style.transform="";if(ready&&!done){sy=9999}};
 stage.addEventListener("pointerdown",e=>{if(ready&&!done)sy=pos(e).y});
 function out(){const lv=draw();const n=1+Math.floor(Math.random()*50);SND.pop();buzz(40);
  const s=el("div","stick",tube);s.style.cssText+=`height:150px;left:47px;top:-20px;z-index:2;transition:top .6s cubic-bezier(.2,1.4,.5,1)`;
  el("em","",s,L("第"+n+"番","No."+n));requestAnimationFrame(()=>requestAnimationFrame(()=>s.style.top="-150px"));
  say(L("出た〜！何番かな？","Here it comes!"));hint("");setTimeout(()=>finish(lv),1500)}
},
/* 2 zeichiku: rub to mix, then tap one stick */
zeichiku(){
 say(L("竹の棒を、指でじゃらじゃら混ぜてね！","Rub the sticks with your finger to mix them!"));
 const r=sz(),n=11,sticks=[];const cx=r.width/2,base=r.height-60;
 const cup=el("div","");cup.style.cssText=`position:absolute;left:${cx-50}px;top:${base-110}px;width:100px;height:120px;border-radius:10px 10px 18px 18px;background:repeating-linear-gradient(90deg,#7a4a1c 0 14px,#6a3e16 14px 17px);box-shadow:0 6px 0 rgba(0,0,0,.25);z-index:3`;
 for(let i=0;i<n;i++){const s=el("div","stick");s.style.cssText+=`height:220px;left:${cx-8}px;top:${base-290}px;transform-origin:50% 100%;transition:transform .12s`;sticks.push(s)}
 const fan=k=>sticks.forEach((s,i)=>s.style.transform=`rotate(${(i-(n-1)/2)*k}deg)`);fan(4);
 const m=meter();hint(L("👆 こすって混ぜる","👆 Rub to mix"));
 let down=false,lp=null,dist=0,phase=0;const need=1600;
 stage.onpointerdown=e=>{down=true;lp=pos(e);stage.setPointerCapture(e.pointerId)};
 stage.onpointermove=e=>{if(!down||phase)return;const p=pos(e);dist+=Math.hypot(p.x-lp.x,p.y-lp.y);lp=p;
  if(Math.random()<.35){SND.rattle();buzz(8)}sticks.forEach((s,i)=>s.style.transform=`rotate(${(i-(n-1)/2)*4+(Math.random()*10-5)}deg) translateY(${Math.random()*14}px)`);m(dist/need);
  if(dist>=need){phase=1;down=false;fan(9);say(L("よし！好きな1本をタップしてね","OK! Tap the stick you like"));hint(L("👆 1本えらぶ","👆 Pick one"));
   sticks.forEach(s=>{s.style.cursor="pointer";s.dataset.tap=1;s.onpointerdown=ev=>{ev.stopPropagation();pickOne(s)}})}};
 stage.onpointerup=stage.onpointercancel=()=>{down=false;if(!phase)fan(4)};
 function pickOne(s){if(phase!==1)return;phase=2;SND.pi();SND.pop();buzz(40);const lv=draw();
  s.style.transition="transform .7s cubic-bezier(.2,1.4,.5,1)";s.style.zIndex=5;s.style.transform+=` translateY(-120px)`;el("em","",s,lvName(lv).slice(0,2));
  sticks.forEach(o=>{if(o!==s)o.style.opacity=.45});hint("");say(L("むむっ…読めたぞ！","Hmm... I can read it!"));setTimeout(()=>finish(lv),1500)}
},

amida(){
 say(L("10本のうち、好きな番号をえらんでね！","Pick a number from 1 to 10!"));
 const r=sz(),N=10,W=r.width,H=r.height,mx=24,colX=i=>mx+i*(W-mx*2)/(N-1),top=72,bot=H-58,rows=13;
 const lv=draw();const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("width",W);svg.setAttribute("height",H);svg.style.cssText="position:absolute;left:0;top:0;pointer-events:none";stage.appendChild(svg);
 const ln=(x1,y1,x2,y2,c,w)=>{const l=document.createElementNS(svg.namespaceURI,"line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("stroke",c);l.setAttribute("stroke-width",w);l.setAttribute("stroke-linecap","round");svg.appendChild(l);return l};
 for(let i=0;i<N;i++)ln(colX(i),top,colX(i),bot,"#fff",4);
 const rungs=[];const rh=(bot-top)/(rows+1);
